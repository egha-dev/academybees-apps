name: Decision needed
description: A question for the Product Owner that changes scope, security, architecture, finance, tenant isolation or UX (CLAUDE.md §2).
labels: [decision]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
    validations:
      required: true
  - type: textarea
    id: default
    attributes:
      label: Safe default applied until decided
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: References (PRD / UX / ADR / C- / OD-)
