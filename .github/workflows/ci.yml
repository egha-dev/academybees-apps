name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by nightly.yml for a full run (no --affected).
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_ENV: ci
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # Turborepo remote cache (OD-21, Vercel). Empty until the token exists → local cache only.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Pull requests check only what changed; pushes to main and the nightly run check everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && !inputs.full && '--affected' || '' }}

# Required checks (ADR-041, scripts/github/apply-governance.sh): verify, integration, build, e2e, pr-title.
# Runner: the repository variable CI_RUNS_ON (JSON), e.g. '["self-hosted","academybee"]' for the
# PO's WSL runner (C-81); unset = GitHub-hosted ubuntu-latest.
jobs:
  verify:
    name: verify
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --affected compares with the base branch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: lint, typecheck, unit tests
        run: pnpm turbo run lint typecheck test ${AFFECTED:+"$AFFECTED"}
      - run: pnpm i18n:check
      - name: release flags not past expiry
        run: pnpm flags:check
      - name: governance script (shellcheck + dry run)
        run: |
          shellcheck scripts/*/*.sh infra/postgres/init/*.sh
          scripts/github/apply-governance.sh --dry-run
      - name: compose file is valid
        run: docker compose -f infra/docker-compose.yml config -q

  integration:
    name: integration
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pull container images
        run: docker pull -q postgres:17-alpine && docker pull -q redis:7-alpine
      # Testcontainers: real Postgres with the ab_* roles, migrations and grants (includes the drift check).
      - run: pnpm test:integration

  build:
    name: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: route JS budget (G-24)
        run: pnpm perf:budget

  e2e:
    name: e2e
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 35
    # Its own Compose project, ports and a fresh database every run, so on the self-hosted runner
    # it never touches the dev containers, their data or the dev servers on 3000/4000 (C-81).
    env:
      COMPOSE: docker compose -p academybee-ci -f infra/docker-compose.yml
      AB_POSTGRES_PORT: '55432'
      AB_REDIS_PORT: '56379'
      AB_SMTP_PORT: '51025'
      AB_MAILPIT_PORT: '58025'
      E2E_WEB_PORT: '3300'
      E2E_API_PORT: '4300'
      LHCI_PORT: '3310'
      MIGRATOR_DATABASE_URL: postgresql://ab_migrator:ab_migrator_local@localhost:55432/academybee
      E2E_MIGRATOR_DATABASE_URL: postgresql://ab_migrator:ab_migrator_local@localhost:55432/academybee
      E2E_DATABASE_URL: postgresql://ab_app:ab_app_local@localhost:55432/academybee
      E2E_PLATFORM_DATABASE_URL: postgresql://ab_platform:ab_platform_local@localhost:55432/academybee
      E2E_REDIS_URL: redis://localhost:56379
      E2E_SMTP_URL: smtp://localhost:51025
      E2E_MAILPIT_URL: http://localhost:58025
      API_ORIGIN: http://localhost:4300
      TRUSTED_PROXY_SECRET: local-proxy-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start Postgres, Redis and Mailpit (fresh)
        run: |
          $COMPOSE down -v --remove-orphans
          $COMPOSE up -d --wait postgres redis mailpit
      - name: migrate
        run: pnpm db:deploy
      - name: seed demo academies (local/ci only, C-54)
        run: pnpm db:seed
        env:
          APP_ENV: ci
      - name: build (en-IN + en-XA + en-LONG web builds)
        run: pnpm build && pnpm --filter @academybee/web build:pseudo
      - name: cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - name: install browsers (self-hosted; system libraries installed once by the PO, C-81)
        if: runner.environment == 'self-hosted'
        timeout-minutes: 15
        run: pnpm --filter @academybee/e2e exec playwright install chromium webkit
      - name: install browsers
        if: runner.environment != 'self-hosted'
        # The Ubuntu mirror sometimes stalls mid-download and apt has no timeout, which hung
        # the job until it was cancelled (2026-10-01). Give apt network timeouts and retries,
        # bound each attempt and retry the whole install.
        timeout-minutes: 15
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null
          for attempt in 1 2 3; do
            timeout 300 pnpm --filter @academybee/e2e exec playwright install --with-deps chromium webkit && exit 0
            echo "::warning::browser install attempt $attempt failed or timed out; retrying"
            sudo pkill -f 'apt-get|dpkg' || true
            sleep 10
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Playwright (desktop, Android, iPhone, pseudo-locales)
        run: pnpm e2e:run
      - name: Lighthouse CI (LCP, CLS, accessibility budgets)
        run: pnpm perf:lighthouse
      - name: upload E2E artifacts (screenshots, traces, reports)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          retention-days: 14
          if-no-files-found: ignore
      - name: remove the CI infra
        if: always()
        run: $COMPOSE down -v --remove-orphans
