name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_ENV: ci
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Required checks (ADR-041). Later Phase 0 slices add integration, drift, build and e2e.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: governance script (shellcheck + dry run)
        run: |
          shellcheck scripts/*/*.sh infra/postgres/init/*.sh
          scripts/github/apply-governance.sh --dry-run
      - name: compose file is valid
        run: docker compose -f infra/docker-compose.yml config -q

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pull container images
        run: docker pull -q postgres:17-alpine && docker pull -q redis:7-alpine
      # Testcontainers: real Postgres with the ab_* roles, migrations and grants (includes the drift check).
      - run: pnpm test:integration
