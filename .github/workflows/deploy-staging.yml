name: Deploy staging

# Every merge to main deploys to staging once CI is green (ADR-041), only while the repository
# variable STAGING_ENABLED is 'true': migrations → `railway up` (api, worker, web) → smoke checks
# (C-77). Setup: docs/runbooks/environments.md and staging-variables.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disabled:
    if: vars.STAGING_ENABLED != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - run: echo "::notice::Staging deploy skipped — set the repository variable STAGING_ENABLED=true once the staging accounts exist (docs/runbooks/environments.md)."

  deploy:
    if: >-
      vars.STAGING_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    uses: ./.github/workflows/deploy.yml
    with:
      prefix: STAGING
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      web_url_var: STAGING_WEB_URL
    secrets: inherit
