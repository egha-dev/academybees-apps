name: Deploy checks (reusable)

# Railway builds and deploys each service itself from the GitHub repo once every check on the
# commit has passed ("Wait for CI", C-76). Migrations run as the last CI job on main, so they finish
# before Railway starts the new code. This workflow optionally (re)applies migrations and then
# waits for the commit to serve and runs the smoke checks.
on:
  workflow_call:
    inputs:
      prefix:
        description: STAGING or PRODUCTION
        type: string
        required: true
      sha:
        description: Commit that should be serving
        type: string
        required: true
      web_url_var:
        description: Name of the repository variable holding the public web URL
        type: string
        required: true
      migrate:
        description: Apply roles + migrations first (manual runs; CI already did it on main)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    if: inputs.migrate
    uses: ./.github/workflows/db-migrate.yml
    with:
      prefix: ${{ inputs.prefix }}
      sha: ${{ inputs.sha }}
    secrets: inherit

  smoke:
    name: smoke check
    needs: migrate
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEB_URL: ${{ vars[inputs.web_url_var] }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: wait for the commit behind the web origin (Railway builds after CI)
        run: |
          [ -n "$WEB_URL" ] || { echo "::error::Set the repository variable ${{ inputs.web_url_var }}"; exit 1; }
          for _ in $(seq 1 180); do
            release=$(curl -fsS "$WEB_URL/api/v1/health/live" | jq -r .release || true)
            [ "$release" = "$SHA" ] && break
            echo "waiting for release $SHA (serving: ${release:-none})"; sleep 10
          done
          [ "$release" = "$SHA" ] || { echo "::error::$SHA is not serving after 30 minutes"; exit 1; }
      - name: readiness (DB + Redis) through the web origin
        run: curl -fsS "$WEB_URL/api/v1/health/ready" | tee /dev/stderr | jq -e '.status == "ok"'
      - name: web shell and offline page
        run: |
          curl -fsS -o /dev/null "$WEB_URL/"
          curl -fsS -o /dev/null "$WEB_URL/offline"
      - name: internal routes cannot be reached by URL
        run: test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/t/demo-a")" = 404
