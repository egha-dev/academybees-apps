# Git hooks (installed by `pnpm install` via the "prepare" script).
output:
  - failure

pre-commit:
  commands:
    not-on-main:
      # ADR-041 / C-44: work happens on branches; main changes only through PRs.
      run: test "$(git branch --show-current)" != "main" || { echo "Commit on a branch (p<phase>/<slice>), not on main."; exit 1; }
    lint-staged:
      run: pnpm exec lint-staged

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    not-to-main:
      run: |
        while read -r local_ref _ remote_ref _; do
          if [ "$remote_ref" = "refs/heads/main" ]; then echo "Never push to main — open a PR (ADR-041)."; exit 1; fi
        done
      use_stdin: true
