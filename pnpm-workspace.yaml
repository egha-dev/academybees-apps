engineStrict: true

packages:
  - apps/*
  - packages/*

# One version per dependency across the repo (ADR-041). Reference with "catalog:".
catalog:
  # toolchain
  turbo: 2.11.5
  typescript: 5.9.3
  '@types/node': 24.19.0
  prettier: 3.9.9
  lefthook: 2.1.15
  lint-staged: 17.6.0
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  # lint
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  typescript-eslint: 8.71.0
  eslint-plugin-boundaries: 7.2.0
  eslint-import-resolver-typescript: 4.4.5
  eslint-config-prettier: 10.1.8
  globals: 17.12.0
  # runtime
  zod: 4.6.5
  uuid: 14.0.2
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  pg: 8.23.0
  '@types/pg': 8.23.1
  tsx: 4.23.15
  testcontainers: 12.2.0
  '@testcontainers/postgresql': 12.2.0
  '@testcontainers/redis': 12.2.0
  # api / worker
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-express': 12.1.2
  '@nestjs/testing': 12.1.2
  rxjs: 7.8.2
  reflect-metadata: 0.2.2
  ioredis: 6.0.0
  bullmq: 6.3.10
  pino: 10.3.1
  pino-http: 11.0.0
  pino-pretty: 13.1.3
  nestjs-pino: 5.2.1
  nestjs-cls: 7.0.1
  express: 5.2.1
  '@types/express': 5.0.6
  '@swc/cli': 0.8.1
  concurrently: 10.0.5
  supertest: 7.3.0
  '@types/supertest': 7.2.1
  # test
  vitest: 5.0.3
  '@vitest/coverage-v8': 5.0.3
  unplugin-swc: 2.0.0
  '@swc/core': 1.16.13

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  unrs-resolver: false
  cpu-features: false
  ssh2: false
  protobufjs: false
  msgpackr-extract: false
  prisma: true
  '@prisma/engines': true

minimumReleaseAgeExclude:
  - lefthook-darwin-arm64@2.1.15
  - lefthook-darwin-x64@2.1.15
  - lefthook-freebsd-arm64@2.1.15
  - lefthook-freebsd-x64@2.1.15
  - lefthook-linux-arm64@2.1.15
  - lefthook-linux-x64@2.1.15
  - lefthook-openbsd-arm64@2.1.15
  - lefthook-openbsd-x64@2.1.15
  - lefthook-windows-arm64@2.1.15
  - lefthook-windows-x64@2.1.15
  - lefthook@2.1.15
  - '@swc/core-darwin-arm64@1.16.13'
  - '@swc/core-darwin-x64@1.16.13'
  - '@swc/core-linux-arm-gnueabihf@1.16.13'
  - '@swc/core-linux-arm64-gnu@1.16.13'
  - '@swc/core-linux-arm64-musl@1.16.13'
  - '@swc/core-linux-ppc64-gnu@1.16.13'
  - '@swc/core-linux-s390x-gnu@1.16.13'
  - '@swc/core-linux-x64-gnu@1.16.13'
  - '@swc/core-linux-x64-musl@1.16.13'
  - '@swc/core-win32-arm64-msvc@1.16.13'
  - '@swc/core-win32-ia32-msvc@1.16.13'
  - '@swc/core-win32-x64-msvc@1.16.13'
  - '@swc/core@1.16.13'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - vitest@5.0.3
  - '@nestjs/common@12.1.2'
  - '@nestjs/core@12.1.2'
  - '@nestjs/platform-express@12.1.2'
  - '@nestjs/testing@12.1.2'
