engineStrict: true

packages:
  - apps/*
  - packages/*
  - e2e

# One version per dependency across the repo (ADR-041). Reference with "catalog:".
catalog:
  # toolchain
  turbo: 2.11.5
  typescript: 5.9.3
  '@types/node': 24.19.0
  prettier: 3.9.9
  lefthook: 2.1.15
  lint-staged: 17.6.0
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  # lint
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  typescript-eslint: 8.71.0
  eslint-plugin-boundaries: 7.2.0
  eslint-import-resolver-typescript: 4.4.5
  eslint-config-prettier: 10.1.8
  globals: 17.12.0
  # runtime
  zod: 4.6.5
  use-intl: 4.14.8
  next-intl: 4.14.8
  '@formatjs/icu-messageformat-parser': 3.5.18
  posthog-node: 5.54.1
  # web / ui
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@mui/material': 9.4.0
  '@mui/icons-material': 9.4.0
  '@mui/material-nextjs': 9.4.0
  '@emotion/react': 11.14.0
  '@emotion/styled': 11.14.1
  '@emotion/cache': 11.14.0
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  '@testing-library/user-event': 14.6.7
  axe-core: 4.13.0
  jsdom: 30.1.1
  '@vitejs/plugin-react': 6.1.1
  eslint-plugin-react: 7.37.5
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-jsx-a11y: 6.10.2
  next: 16.3.8
  '@next/eslint-plugin-next': 16.3.8
  '@tanstack/react-query': 5.104.0
  '@serwist/turbopack': 9.5.12
  '@serwist/window': 9.5.12
  serwist: 9.5.12
  esbuild: 0.28.2
  '@fontsource-variable/inter': 5.3.0
  server-only: 0.0.1
  dexie: 4.4.6
  fake-indexeddb: 6.2.5
  '@playwright/test': 1.63.0
  '@axe-core/playwright': 4.13.0
  '@lhci/cli': 0.15.1
  '@sentry/node': 11.1.0
  '@sentry/nextjs': 11.1.0
  uuid: 14.0.2
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  pg: 8.23.0
  '@types/pg': 8.23.1
  tsx: 4.23.15
  testcontainers: 12.2.0
  '@testcontainers/postgresql': 12.2.0
  '@testcontainers/redis': 12.2.0
  # api / worker
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-express': 12.1.2
  '@nestjs/testing': 12.1.2
  rxjs: 7.8.2
  reflect-metadata: 0.2.2
  ioredis: 6.0.0
  bullmq: 6.3.10
  pino: 10.3.1
  pino-http: 11.0.0
  pino-pretty: 13.1.3
  nestjs-pino: 5.2.1
  nestjs-cls: 7.0.1
  express: 5.2.1
  '@types/express': 5.0.6
  '@swc/cli': 0.8.1
  concurrently: 10.0.5
  supertest: 7.3.0
  '@types/supertest': 7.2.1
  # test
  vitest: 5.0.3
  fast-check: 4.10.2
  '@vitest/coverage-v8': 5.0.3
  unplugin-swc: 2.0.0
  '@swc/core': 1.16.13

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  unrs-resolver: false
  cpu-features: false
  ssh2: false
  protobufjs: false
  msgpackr-extract: false
  '@parcel/watcher': false
  sharp: false
  prisma: true
  '@prisma/engines': true

